<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <header class="site-header">
  <link rel="icon" type="image/png" href="images/logo.png">
    <div class="header-container container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-utensils"></i></div>
        <span class="brand-title">Foodie<span>Express</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="reservations.html" class="nav-link">Reservations</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="wishlist.html" class="nav-link">Wishlist</a>
      </nav>

      <div class="header-actions">
        <a href="wishlist.html" class="header-icon-btn" title="Wishlist">
          <i class="fa-regular fa-heart"></i>
          <span class="header-badge wishlist-count-badge" style="display: none;">0</span>
        </a>
        <a href="cart.html" class="header-icon-btn" title="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="header-badge cart-count-badge" style="display: none;">0</span>
        </a>
        <button class="user-menu-btn" id="userProfileBtn">
          <div class="user-avatar-circle" id="headerUserAvatar">👤</div>
          <span id="headerUserName">Account</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 650px; margin: 40px auto 60px auto;">
    <div class="card" style="padding: 36px;">
      <div style="display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 24px;">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; box-shadow: 0 4px 14px rgba(232, 93, 4, 0.25);" id="userProfileAvatar">
          U
        </div>
        <div>
          <h2 style="font-size: 1.4rem; font-weight: 800; color: var(--dark); margin-bottom: 4px;" id="profileHeadingName">Customer Profile</h2>
          <span style="font-size: 0.85rem; color: var(--text-muted);" id="profileHeadingRole">Verified Foodie Patron</span>
        </div>
      </div>

      <form id="profileForm" onsubmit="saveProfileChanges(event)">
        <div style="margin-bottom: 18px;">
          <label class="form-label">Full Name</label>
          <input type="text" id="profName" required class="form-control">
        </div>

        <div style="margin-bottom: 18px;">
          <label class="form-label">Email Address</label>
          <input type="email" id="profEmail" readonly class="form-control" style="background: var(--surface-soft); cursor: not-allowed;">
        </div>

        <div style="margin-bottom: 18px;">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="profPhone" placeholder="Enter contact number" class="form-control">
        </div>

        <div style="margin-bottom: 24px;">
          <label class="form-label">Delivery City / Location</label>
          <input type="text" id="profLocation" placeholder="e.g. Bangalore, Karnataka" class="form-control">
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end;">
          <button type="button" class="btn btn-outline" onclick="AuthService.logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
          </button>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-grid">
      <a href="index.html" class="mobile-nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="menu.html" class="mobile-nav-item">
        <i class="fa-solid fa-utensils"></i>
        <span>Menu</span>
      </a>
      <a href="orders.html" class="mobile-nav-item">
        <i class="fa-solid fa-receipt"></i>
        <span>Orders</span>
      </a>
      <a href="cart.html" class="mobile-nav-item">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Cart</span>
        <span class="mobile-badge cart-count-badge" style="display: none;">0</span>
      </a>
      <a href="profile.html" class="mobile-nav-item active">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('profName').value = user.name || '';
      document.getElementById('profEmail').value = user.email || '';
      document.getElementById('profPhone').value = user.phone || '';
      document.getElementById('profLocation').value = user.location || '';
      
      const initial = (user.name || 'U').charAt(0).toUpperCase();
      document.getElementById('userProfileAvatar').textContent = initial;
      document.getElementById('profileHeadingName').textContent = user.name || 'User Profile';
    });

    async function saveProfileChanges(e) {
      e.preventDefault();
      const user = JSON.parse(localStorage.getItem('user')) || {};
      user.name = document.getElementById('profName').value.trim();
      user.phone = document.getElementById('profPhone').value.trim();
      user.location = document.getElementById('profLocation').value.trim();

      localStorage.setItem('user', JSON.stringify(user));
      FoodieApp.showToast('Profile details updated successfully!', 'success');
      setTimeout(() => location.reload(), 800);
    }
  </script>
</body>
</html>
