<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .success-card {
      max-width: 600px;
      margin: 60px auto;
      background: var(--bg-surface);
      border-radius: var(--radius-2xl);
      border: 1px solid var(--border);
      padding: 48px 36px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .success-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--success-subtle);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 24px auto;
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="site-header">
  <link rel="icon" type="image/png" href="images/logo.png">
    <div class="header-container container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-utensils"></i></div>
        <span class="brand-title">Foodie<span>Express</span></span>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="success-card">
      <div class="success-icon-wrap">
        <i class="fa-solid fa-check"></i>
      </div>

      <h1 style="font-size: 2rem; margin-bottom: 10px; color: var(--text-dark);">Order Confirmed!</h1>
      <p style="color: var(--text-muted); margin-bottom: 28px;">
        Thank you for choosing Foodie Express. The kitchen has received your order and is preparing it fresh.
      </p>

      <div style="background: var(--bg-subtle); border-radius: var(--radius-lg); padding: 20px; text-align: left; margin-bottom: 32px; font-size: 0.92rem; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">Estimated Delivery:</span>
          <strong>25–35 Mins</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">Order Reference:</span>
          <strong id="receiptOrderId">#FE-LIVE</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-muted);">Payment Mode:</span>
          <strong id="receiptMethod">Online UPI / Card</strong>
        </div>
      </div>

      <div style="display: flex; gap: 14px; justify-content: center;">
        <a href="orders.html" class="btn btn-primary btn-lg">
          <i class="fa-solid fa-truck-fast"></i> Track My Order
        </a>
        <a href="menu.html" class="btn btn-outline btn-lg">
          Browse More
        </a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const receipt = JSON.parse(localStorage.getItem('lastOrderReceipt'));
        if (receipt) {
          if (receipt.orderId) document.getElementById('receiptOrderId').textContent = receipt.orderId;
          if (receipt.method) document.getElementById('receiptMethod').textContent = receipt.method;
        }
      } catch (e) {
        console.warn(e);
      }
    });
  </script>
</body>
</html>
