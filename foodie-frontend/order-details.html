<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details & Live Tracking — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .details-layout {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 32px;
      margin: 36px 0 60px 0;
    }
    .tracking-hero {
      background: linear-gradient(135deg, rgba(232, 93, 4, 0.08) 0%, rgba(244, 140, 6, 0.04) 100%);
      border: 1px solid rgba(232, 93, 4, 0.2);
      border-radius: var(--radius-2xl);
      padding: 32px;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) {
      .details-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
  <link rel="icon" type="image/png" href="images/logo.png">
    <div class="header-container container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-utensils"></i></div>
        <span class="brand-title">Foodie<span>Express</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="reservations.html" class="nav-link">Reservations</a>
        <a href="orders.html" class="nav-link active">Orders</a>
      </nav>

      <div class="header-actions">
        <a href="orders.html" class="btn btn-outline btn-sm">
          <i class="fa-solid fa-arrow-left"></i> All Orders
        </a>
      </div>
    </div>
  </header>

  <main class="container" id="detailsWrapper">
    <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top: 12px;">Loading order tracking & receipt...</p>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const wrapper = document.getElementById('detailsWrapper');

      if (!id) {
        location.href = 'orders.html';
        return;
      }

      try {
        const token = localStorage.getItem('token');
        const headers = {};
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`${FoodieApp.API_BASE}/api/orders/${id}`, { headers });
        if (!res.ok) throw new Error('Could not load order');
        const order = await res.json();

        let items = [];
        try {
          items = typeof order.cartJson === 'string' ? JSON.parse(order.cartJson) : order.cartJson;
        } catch (e) {
          items = [];
        }

        const status = (order.orderStatus || 'PENDING').toUpperCase();
        const steps = ['PENDING', 'CONFIRMED', 'PREPARING', 'OUT_FOR_DELIVERY', 'DELIVERED'];
        const currentIdx = steps.indexOf(status);

        let progressPct = 10;
        if (currentIdx === 1) progressPct = 30;
        if (currentIdx === 2) progressPct = 55;
        if (currentIdx === 3) progressPct = 80;
        if (currentIdx === 4) progressPct = 100;

        wrapper.innerHTML = `
          <!-- Tracking Banner -->
          <div class="tracking-hero">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
              <div>
                <span class="status-pill ${status.toLowerCase()}">${status.replace(/_/g, ' ')}</span>
                <h1 style="font-size: 1.8rem; margin: 8px 0 4px 0;">Order #FE-${order.id}</h1>
                <p style="color: var(--text-muted); font-size: 0.88rem;">Estimated Arrival: <strong>25–35 mins</strong></p>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 0.85rem; color: var(--text-muted);">Total Amount</div>
                <div style="font-size: 1.6rem; font-weight: 800; color: var(--primary);">₹${parseFloat(order.totalAmount || 0).toFixed(2)}</div>
              </div>
            </div>

            <!-- Timeline -->
            <div class="timeline-track">
              <div class="timeline-progress-bar" style="width: ${progressPct}%;"></div>

              <div class="timeline-step ${currentIdx >= 0 ? (currentIdx > 0 ? 'completed' : 'active') : ''}">
                <div class="step-node">${currentIdx > 0 ? '✓' : '1'}</div>
                <span class="step-label">Placed</span>
              </div>

              <div class="timeline-step ${currentIdx >= 1 ? (currentIdx > 1 ? 'completed' : 'active') : ''}">
                <div class="step-node">${currentIdx > 1 ? '✓' : '2'}</div>
                <span class="step-label">Confirmed</span>
              </div>

              <div class="timeline-step ${currentIdx >= 2 ? (currentIdx > 2 ? 'completed' : 'active') : ''}">
                <div class="step-node">${currentIdx > 2 ? '✓' : '3'}</div>
                <span class="step-label">Preparing</span>
              </div>

              <div class="timeline-step ${currentIdx >= 3 ? (currentIdx > 3 ? 'completed' : 'active') : ''}">
                <div class="step-node">${currentIdx > 3 ? '✓' : '4'}</div>
                <span class="step-label">Out for Delivery</span>
              </div>

              <div class="timeline-step ${currentIdx >= 4 ? 'completed' : ''}">
                <div class="step-node">${currentIdx >= 4 ? '✓' : '5'}</div>
                <span class="step-label">Delivered</span>
              </div>
            </div>
          </div>

          <div class="details-layout">
            <!-- Left: Items -->
            <div class="card">
              <h3 style="margin-bottom: 20px;">Ordered Dishes</h3>
              <div style="display: flex; flex-direction: column; gap: 16px;">
                ${Array.isArray(items) && items.length > 0 ? items.map(item => `
                  <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid var(--border);">
                    <div style="display: flex; align-items: center; gap: 14px;">
                      ${item.image ? `<img src="${item.image}" style="width: 52px; height: 52px; border-radius: 10px; object-fit: cover;">` : ''}
                      <div>
                        <strong style="font-size: 1rem; color: var(--text-dark);">${item.name}</strong>
                        <div style="font-size: 0.82rem; color: var(--text-muted);">Quantity: ${item.quantity || 1}</div>
                      </div>
                    </div>
                    <span style="font-weight: 700; color: var(--text-dark);">₹${(parseFloat(item.price || 0) * (item.quantity || 1)).toFixed(2)}</span>
                  </div>
                `).join('') : `<p style="color:var(--text-muted);">${order.cartJson || 'No structured items'}</p>`}
              </div>

              <div style="margin-top: 24px; padding-top: 16px; border-top: 1px dashed var(--border); display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; justify-content: space-between; font-size: 0.92rem; color: var(--text-muted);">
                  <span>Subtotal:</span>
                  <span>₹${parseFloat(order.totalAmount || 0).toFixed(2)}</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.92rem; color: var(--text-muted);">
                  <span>Delivery Charge:</span>
                  <span style="color: var(--success); font-weight: 600;">FREE</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; color: var(--text-dark); margin-top: 8px;">
                  <span>Grand Total:</span>
                  <span style="color: var(--primary);">₹${parseFloat(order.totalAmount || 0).toFixed(2)}</span>
                </div>
              </div>
            </div>

            <!-- Right: Delivery & Payment Details -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
              ${order.supervisor ? `
                <div class="card" style="border-left: 4px solid var(--primary); background: #FFFBF7;">
                  <h3 style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-person-biking" style="color: var(--primary);"></i> Assigned Delivery Partner
                  </h3>
                  <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 12px;">
                    <div style="width: 44px; height: 44px; border-radius: 50%; background: #FFE8D6; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700;">
                      ${(order.supervisor.name ? order.supervisor.name.charAt(0) : 'S').toUpperCase()}
                    </div>
                    <div>
                      <strong style="font-size: 1rem; color: var(--text-dark);">${order.supervisor.name}</strong>
                      <div style="font-size: 0.82rem; color: var(--text-muted);">Delivery Supervisor &bull; Foodie Express</div>
                    </div>
                  </div>
                  <div style="display: flex; gap: 10px;">
                    <a href="tel:${order.supervisor.phone || ''}" class="btn btn-sm btn-primary" style="flex: 1; justify-content: center; text-decoration: none;">
                      <i class="fa-solid fa-phone"></i> Call Delivery Partner
                    </a>
                  </div>
                </div>
              ` : ''}

              <div class="card">
                <h3 style="margin-bottom: 14px;"><i class="fa-solid fa-location-dot" style="color: var(--primary); margin-right: 8px;"></i> Delivery Destination</h3>
                <p style="font-weight: 600; color: var(--text-dark); margin-bottom: 4px;">${order.name || 'Customer'}</p>
                <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5;">${order.address || 'Standard Address'}</p>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;"><i class="fa-solid fa-phone"></i> ${order.phone || 'N/A'}</p>
              </div>

              <div class="card">
                <h3 style="margin-bottom: 14px;"><i class="fa-solid fa-credit-card" style="color: var(--success); margin-right: 8px;"></i> Payment Details</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem;">
                  <span style="color: var(--text-muted);">Payment Method:</span>
                  <strong>${order.paymentMethod || 'COD'}</strong>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.9rem;">
                  <span style="color: var(--text-muted);">Payment Status:</span>
                  <span class="status-pill ${(order.paymentStatus || 'pending').toLowerCase()}">${order.paymentStatus || 'PAID'}</span>
                </div>
              </div>

              <button class="btn btn-outline" onclick="window.print()" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-print"></i> Download / Print Invoice
              </button>
            </div>
          </div>
        `;
      } catch (err) {
        wrapper.innerHTML = `<div style="text-align:center;padding:48px;color:var(--error);">Failed to load order receipt.</div>`;
      }
    });
  </script>
</body>
</html>
