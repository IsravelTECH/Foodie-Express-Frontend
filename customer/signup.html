<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/foodie-logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/customer.css">
</head>
<body>
  <div class="signup-wrapper">
    <div class="signup-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 16px;">
          <img src="images/foodie-logo.png" alt="Foodie Logo" class="logo-img">
          <span class="brand-title">Foodie<span>Express</span></span>
        </a>
        <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--cust-navy); margin-bottom: 6px;">Create Your Account</h1>
        <p style="color: var(--cust-text-secondary); font-size: 0.9rem;">Join Foodie Express for lightning food delivery & dining reservations.</p>
      </div>

      <form id="signup-form" onsubmit="AuthService.handleSignup(event)">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name *</label>
          <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Create Password *</label>
          <div class="input-with-icon">
            <input type="password" id="signup-password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password" oninput="updateStrength(this.value)">
            <button type="button" class="input-toggle-pwd" onclick="AuthService.togglePasswordVisibility('signup-password', this)">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="strength-meter">
            <div id="pwdStrengthFill" class="strength-fill"></div>
          </div>
          <div id="pwdStrengthText" style="font-size: 0.75rem; color: var(--cust-text-muted); margin-top: 4px; text-align: right; font-weight: 600;"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" style="padding: 14px; margin-top: 8px; margin-bottom: 20px;">
          Create Account <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div style="text-align: center; font-size: 0.88rem; color: var(--cust-text-secondary); padding-top: 16px; border-top: 1px solid var(--cust-border);">
          <p>Already have an account? <a href="login.html" style="color: var(--cust-primary); font-weight: 700;">Sign In</a></p>
          <div style="margin-top: 12px;">
            <a href="index.html" style="font-size: 0.82rem; color: var(--cust-text-muted); font-weight: 600;">
              <i class="fa-solid fa-arrow-left"></i> Back to Storefront
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../shared/js/api.js"></script>
  <script src="js/customer.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function updateStrength(pwd) {
      const st = AuthService.checkPasswordStrength(pwd);
      const fill = document.getElementById('pwdStrengthFill');
      const text = document.getElementById('pwdStrengthText');
      if (fill) {
        fill.style.width = `${st.score}%`;
        fill.style.backgroundColor = st.color;
      }
      if (text) {
        text.textContent = st.text ? `Strength: ${st.text}` : '';
        text.style.color = st.color;
      }
    }
  </script>
</body>
</html>
