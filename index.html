<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie Express — Redirecting...</title>
  <link rel="icon" type="image/png" href="images/foodie-logo.png">
  <script>
    // Automatic Role-Based Entry Routing
    (function() {
      try {
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        if (token && userStr) {
          const user = JSON.parse(userStr);
          const role = (user.role || '').replace('ROLE_', '').toUpperCase();
          if (role === 'ADMIN') {
            window.location.replace('admin/dashboard.html');
            return;
          } else if (role === 'SUPERVISOR') {
            window.location.replace('supervisor/dashboard.html');
            return;
          }
        }
      } catch (e) {
        console.warn('Routing fallback:', e);
      }
      window.location.replace('customer/index.html');
    })();
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #FFF9F5;">
  <div style="text-align: center;">
    <img src="images/foodie-logo.png" alt="Foodie Express" style="height: 64px; width: auto; margin-bottom: 16px;">
    <h2 style="color: #101828; margin: 0 0 8px 0;">Foodie Express</h2>
    <p style="color: #6B7280; margin: 0 0 16px 0;">Loading gourmet food experience...</p>
    <a href="customer/index.html" style="color: #FF6B00; text-decoration: none; font-weight: bold;">Click here if not redirected automatically &rarr;</a>
  </div>
</body>
</html>
