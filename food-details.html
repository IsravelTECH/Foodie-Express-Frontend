<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dish Details — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 48px;
      align-items: center;
      background: var(--bg-surface);
      border-radius: var(--radius-2xl);
      border: 1px solid var(--border);
      padding: 40px;
      margin: 40px 0 60px 0;
      box-shadow: var(--shadow-sm);
    }
    .details-img-wrap {
      width: 100%;
      height: 420px;
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: #F4F4F5;
      position: relative;
    }
    .details-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (max-width: 860px) {
      .details-grid { grid-template-columns: 1fr; padding: 24px; gap: 24px; }
      .details-img-wrap { height: 280px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
  <link rel="icon" type="image/png" href="images/logo.png">
    <div class="header-container container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-utensils"></i></div>
        <span class="brand-title">Foodie<span>Express</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link active">Menu</a>
        <a href="reservations.html" class="nav-link">Reservations</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="wishlist.html" class="nav-link">Wishlist</a>
      </nav>

      <div class="header-actions">
        <a href="cart.html" class="header-icon-btn" title="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="header-badge cart-count-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container" id="detailsContainer">
    <div style="text-align: center; padding: 60px 0; color: var(--text-muted);">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top: 12px;">Loading dish details...</p>
    </div>
  </main>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const container = document.getElementById('detailsContainer');

      if (!id) {
        location.href = 'menu.html';
        return;
      }

      try {
        const res = await fetch(`${FoodieApp.API_BASE}/api/menu`);
        const dishes = await res.json();
        const dish = dishes.find(d => d.id == id) || dishes[0];

        const img = dish.imageUrl || FoodieApp.getDishImage(dish.name);
        const isVeg = dish.foodType === 'VEG';

        container.innerHTML = `
          <div class="details-grid">
            <div class="details-img-wrap">
              <img src="${img}" alt="${dish.name}" onerror="this.src='images/indianfood.jpg'">
              <div class="food-card-diet-badge ${isVeg ? 'diet-veg' : 'diet-nonveg'}">
                <span class="diet-dot"></span>
                <span>${isVeg ? 'VEG' : 'NON-VEG'}</span>
              </div>
            </div>

            <div>
              <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase;">${dish.category || 'Specialty'}</span>
                <span style="background: #FEF3C7; color: #D97706; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; font-weight: 700;">
                  <i class="fa-solid fa-star"></i> ${dish.rating || 4.8}
                </span>
              </div>

              <h1 style="font-size: 2.2rem; margin-bottom: 12px; color: var(--text-dark);">${dish.name}</h1>
              <div style="font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 20px;">
                ₹${parseFloat(dish.price).toFixed(2)}
              </div>

              <p style="color: var(--text-secondary); font-size: 1.05rem; line-height: 1.7; margin-bottom: 28px;">
                ${dish.description || 'Expertly prepared with farm-fresh produce, authentic spices, and cooked to perfection for a memorable dining experience.'}
              </p>

              <div style="display: flex; gap: 24px; align-items: center; margin-bottom: 32px; padding: 16px; background: var(--bg-subtle); border-radius: var(--radius-lg);">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <i class="fa-solid fa-clock" style="color: var(--primary);"></i>
                  <span style="font-size: 0.9rem; font-weight: 600;">20-25 Mins Prep</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <i class="fa-solid fa-fire" style="color: #DC2626;"></i>
                  <span style="font-size: 0.9rem; font-weight: 600;">Chef Special</span>
                </div>
              </div>

              <div style="display: flex; gap: 16px; align-items: center;">
                <div class="qty-stepper" style="height: 48px;">
                  <button class="qty-stepper-btn" onclick="changeDetailQty(-1)" style="width: 44px; font-size: 1.2rem;">−</button>
                  <span class="qty-stepper-val" id="detailQty" style="min-width: 36px; font-size: 1.1rem;">1</span>
                  <button class="qty-stepper-btn" onclick="changeDetailQty(1)" style="width: 44px; font-size: 1.2rem;">+</button>
                </div>

                <button class="btn btn-primary btn-lg" style="flex: 1;" onclick="addDetailToCart('${dish.name.replace(/'/g, "\\'")}', ${dish.price}, '${img}')">
                  <i class="fa-solid fa-bag-shopping"></i> Add to Cart
                </button>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div style="text-align:center;padding:48px;color:var(--error);">Failed to load dish details.</div>`;
      }
    });

    function changeDetailQty(delta) {
      const el = document.getElementById('detailQty');
      let val = parseInt(el.textContent) || 1;
      val = Math.max(1, val + delta);
      el.textContent = val;
    }

    function addDetailToCart(name, price, img) {
      const qty = parseInt(document.getElementById('detailQty').textContent) || 1;
      CartService.addToCart(name, price, qty, img);
    }
  </script>
</body>
</html>
