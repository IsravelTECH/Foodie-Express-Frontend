<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <title>Redirecting to Supervisor Portal...</title>
  <script>
    const userStr = localStorage.getItem('user');
    const token = localStorage.getItem('token');
    try {
      const user = userStr ? JSON.parse(userStr) : null;
      const role = user ? (user.role || '').replace('ROLE_', '').toUpperCase() : '';
      if (token && (role === 'SUPERVISOR' || role === 'ADMIN')) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('../admin/login.html');
      }
    } catch {
      window.location.replace('../admin/login.html');
    }
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">Redirecting to Foodie Express Supervisor Operations...</p>
</body>
</html>
