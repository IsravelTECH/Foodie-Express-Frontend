<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Manifest — Foodie Express Delivery Portal</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <style>
    .delivery-action-bottom-bar {
      position: sticky;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-top: 1px solid var(--admin-border);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      margin: 24px -24px -24px -24px;
    }
    @media (max-width: 768px) {
      .delivery-action-bottom-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 12px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <!-- Supervisor Sidebar -->
    <aside class="admin-sidebar" id="supervisorSidebar">
      <div class="admin-brand">
        <div class="brand-logo" style="background: linear-gradient(135deg, #E85D04, #F48C06);"><i class="fa-solid fa-person-biking"></i></div>
        <div class="brand-text">
          <h2>Foodie Express</h2>
          <span style="color: #E85D04; font-weight: 700;">Delivery Operations</span>
        </div>
      </div>

      <div class="sidebar-section-title">DELIVERY OPERATIONS</div>
      <nav class="admin-nav">
        <a href="supervisor-dashboard.html" class="admin-nav-link">
          <i class="fa-solid fa-chart-pie"></i><span>Dashboard</span>
        </a>
        <a href="supervisor-orders.html" class="admin-nav-link active">
          <i class="fa-solid fa-boxes-stacked"></i><span>Assigned Orders</span>
        </a>
      </nav>

      <div class="sidebar-section-title">SYSTEM</div>
      <nav class="admin-nav">
        <a href="index.html" class="admin-nav-link" target="_blank">
          <i class="fa-solid fa-arrow-up-right-from-square"></i><span>Live Storefront</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <div class="admin-user-profile">
          <div class="admin-avatar" id="supervisorUserInitial" style="background: #FFF1E8; color: #E85D04;">S</div>
          <div class="admin-user-details">
            <h4 id="supervisorUserName">Supervisor</h4>
            <span id="supervisorUserEmail">supervisor@foodie.com</span>
          </div>
        </div>
        <button class="admin-btn admin-btn-outline admin-btn-sm" style="width: 100%; justify-content: center;" onclick="SupervisorApp.logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar"><i class="fa-solid fa-bars"></i></button>
        <div style="font-weight: 600; color: var(--admin-text-main);">Delivery Manifest &amp; Customer Route</div>
        <div class="topbar-actions">
          <a href="supervisor-orders.html" class="admin-btn admin-btn-outline admin-btn-sm">
            <i class="fa-solid fa-arrow-left"></i> Back to Orders
          </a>
        </div>
      </header>

      <div class="admin-content" id="supervisorOrderDetailContainer">
        <div style="text-align: center; padding: 48px; color: var(--admin-text-muted);">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
          <p style="margin-top: 12px;">Loading order details...</p>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/supervisor/supervisor.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id');
      const container = document.getElementById('supervisorOrderDetailContainer');

      if (!orderId) {
        container.innerHTML = `<div style="text-align:center;padding:48px;"><h3>No order ID specified.</h3><a href="supervisor-orders.html" class="admin-btn admin-btn-primary" style="margin-top:12px;">Return to Orders</a></div>`;
        return;
      }

      try {
        const res = await SupervisorApp.authFetch(`/api/supervisor/orders/${orderId}`);
        if (!res.ok) throw new Error('Order not found or not assigned to you');
        const order = await res.json();

        let items = [];
        try {
          items = typeof order.cartJson === 'string' ? JSON.parse(order.cartJson) : order.cartJson;
        } catch (e) {
          console.warn('Could not parse cart JSON', e);
        }

        const encodedAddress = encodeURIComponent(order.address || 'Chennai');
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`;

        let stickyActionBtn = '';
        if (order.orderStatus === 'PREPARING' || order.orderStatus === 'CONFIRMED' || order.orderStatus === 'READY') {
          stickyActionBtn = `
            <button class="admin-btn admin-btn-primary" style="min-height: 48px; padding: 0 24px; font-size: 1rem;" onclick="updateOrderStatus(${order.id}, 'OUT_FOR_DELIVERY')">
              <i class="fa-solid fa-motorcycle"></i> Mark Out for Delivery
            </button>
          `;
        } else if (order.orderStatus === 'OUT_FOR_DELIVERY') {
          stickyActionBtn = `
            <button class="admin-btn admin-btn-success" style="min-height: 48px; padding: 0 24px; font-size: 1rem;" onclick="updateOrderStatus(${order.id}, 'DELIVERED')">
              <i class="fa-solid fa-circle-check"></i> Mark as Delivered
            </button>
          `;
        } else {
          stickyActionBtn = `
            <div style="font-weight: 700; color: #16A34A; font-size: 1.05rem; display: flex; align-items: center; gap: 8px;">
              <i class="fa-solid fa-circle-check"></i> Delivery Completed Successfully
            </div>
          `;
        }

        container.innerHTML = `
          <div class="admin-page-header">
            <div>
              <h1>Order Manifest #FE-${order.id}</h1>
              <p>Assigned for Delivery &bull; Placed on ${order.createdAt ? new Date(order.createdAt).toLocaleString() : 'Recently'}</p>
            </div>
            <div>
              <span class="badge-status status-${(order.orderStatus || 'pending').toLowerCase()}" style="font-size: 0.95rem; padding: 8px 16px;">
                ${order.orderStatus ? order.orderStatus.replace(/_/g, ' ') : 'PREPARING'}
              </span>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
            <!-- Left: Ordered Items -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
              <div class="admin-card">
                <div class="admin-card-header">
                  <h3>Food Items (${Array.isArray(items) ? items.length : 0})</h3>
                </div>
                <div class="admin-table-responsive">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Dish / Item</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${Array.isArray(items) && items.length > 0 ? items.map(item => `
                        <tr>
                          <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                              ${item.image ? `<img src="${item.image}" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover;">` : ''}
                              <div>
                                <strong style="font-size: 0.95rem;">${item.name || 'Dish'}</strong>
                                <div style="font-size: 0.78rem; color: var(--admin-text-muted);">${item.category || 'Food Item'}</div>
                              </div>
                            </div>
                          </td>
                          <td>₹${parseFloat(item.price || 0).toFixed(2)}</td>
                          <td><strong>× ${item.quantity || 1}</strong></td>
                          <td><strong>₹${(parseFloat(item.price || 0) * (item.quantity || 1)).toFixed(2)}</strong></td>
                        </tr>
                      `).join('') : `<tr><td colspan="4" style="text-align:center;padding:16px;">${order.cartJson || 'No structured items'}</td></tr>`}
                    </tbody>
                  </table>
                </div>

                <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--admin-border); display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
                  <div style="display: flex; justify-content: space-between; width: 240px; font-size: 1.15rem; font-weight: 800; color: var(--admin-text-main);">
                    <span>Total Bill:</span>
                    <span style="color: var(--admin-primary);">₹${parseFloat(order.totalAmount || 0).toFixed(2)}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right: Delivery Details -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
              <div class="admin-card">
                <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-location-dot" style="color: #E85D04; margin-right: 8px;"></i> Delivery Destination</h3>
                <div style="font-size: 0.92rem; line-height: 1.6; color: var(--admin-text-main);">
                  <p style="font-size: 1rem;"><strong>${order.address || 'Standard Address'}</strong></p>
                  <p style="color: var(--admin-text-muted); margin-top: 6px;">Customer Name: <strong>${order.name || 'Customer'}</strong></p>
                  <p style="color: var(--admin-text-muted); margin-top: 4px;">Phone: <strong><a href="tel:${order.phone}" style="color: #2563EB;"><i class="fa-solid fa-phone"></i> ${order.phone || 'N/A'}</a></strong></p>
                  <div style="margin-top: 14px;">
                    <a href="${mapUrl}" target="_blank" class="admin-btn admin-btn-outline admin-btn-sm" style="width: 100%; justify-content: center;">
                      <i class="fa-solid fa-map-location-dot"></i> Open Google Maps
                    </a>
                  </div>
                </div>
              </div>

              <div class="admin-card">
                <h3 style="margin-bottom: 16px;"><i class="fa-solid fa-money-bill-wave" style="color: #10B981; margin-right: 8px;"></i> Payment &amp; Collection</h3>
                <div style="display: flex; flex-direction: column; gap: 10px; font-size: 0.92rem;">
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--admin-text-muted);">Payment Method:</span>
                    <strong>${order.paymentMethod || 'COD'}</strong>
                  </div>
                  <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--admin-text-muted);">Payment Status:</span>
                    <span class="badge-status status-${(order.paymentStatus || 'pending').toLowerCase()}">
                      ${order.paymentStatus || 'PENDING'}
                    </span>
                  </div>
                  ${order.paymentMethod === 'COD' && order.paymentStatus !== 'SUCCESS' ? `
                    <div style="background: #FEF3C7; border: 1px solid #FCD34D; color: #92400E; padding: 12px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; margin-top: 6px;">
                      <i class="fa-solid fa-triangle-exclamation"></i> Collect Cash ₹${parseFloat(order.totalAmount || 0).toFixed(2)} upon doorstep handover.
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>

          <!-- Sticky Action Bar -->
          <div class="delivery-action-bottom-bar">
            <div>
              <span style="color: var(--admin-text-muted); font-size: 0.85rem; display: block;">Active Action for #FE-${order.id}</span>
              <strong style="color: var(--admin-text-main);">Current: ${order.orderStatus ? order.orderStatus.replace(/_/g, ' ') : 'PREPARING'}</strong>
            </div>
            <div>
              ${stickyActionBtn}
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<div style="text-align:center;padding:48px;color:#EF4444;"><h3>Failed to load order manifest.</h3><a href="supervisor-orders.html" class="admin-btn admin-btn-outline" style="margin-top:12px;">Back to Orders</a></div>`;
      }
    });

    async function updateOrderStatus(orderId, newStatus) {
      const confirmed = await FoodieApp.confirmModal({
        title: `Advance Delivery Status?`,
        message: `Mark Order #FE-${orderId} as ${newStatus.replace(/_/g, ' ')}?`,
        confirmText: `Confirm ${newStatus.replace(/_/g, ' ')}`,
        type: 'primary'
      });
      if (!confirmed) return;

      try {
        const res = await SupervisorApp.authFetch(`/api/supervisor/orders/${orderId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: newStatus })
        });
        if (res.ok) {
          FoodieApp.showToast(`Order #FE-${orderId} marked as ${newStatus.replace(/_/g, ' ')}!`, 'success', 'Status Updated');
          setTimeout(() => location.reload(), 800);
        } else {
          const err = await res.json();
          FoodieApp.showToast(err.error || 'Failed to update order status.', 'error');
        }
      } catch (err) {
        console.error(err);
        FoodieApp.showToast('Server error updating order status.', 'error');
      }
    }
  </script>
</body>
</html>
