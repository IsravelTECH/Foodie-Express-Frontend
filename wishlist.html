<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Favorites & Wishlist — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .wishlist-hero {
      background: radial-gradient(circle at 50% 0%, rgba(232, 93, 4, 0.08) 0%, rgba(255, 253, 249, 0) 70%);
      padding: 40px 0 28px 0;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin: 36px 0 60px 0;
    }
  </style>
</head>
<body>
  <header class="site-header">
  <link rel="icon" type="image/png" href="images/logo.png">
    <div class="header-container container">
      <a href="index.html" class="brand-logo">
        <div class="logo-badge"><i class="fa-solid fa-utensils"></i></div>
        <span class="brand-title">Foodie<span>Express</span></span>
      </a>

      <nav class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="menu.html" class="nav-link">Menu</a>
        <a href="reservations.html" class="nav-link">Reservations</a>
        <a href="orders.html" class="nav-link">Orders</a>
        <a href="wishlist.html" class="nav-link active">Wishlist</a>
      </nav>

      <div class="header-actions">
        <a href="wishlist.html" class="header-icon-btn" title="Wishlist">
          <i class="fa-regular fa-heart"></i>
          <span class="header-badge wishlist-count-badge" style="display: none;">0</span>
        </a>
        <a href="cart.html" class="header-icon-btn" title="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="header-badge cart-count-badge" style="display: none;">0</span>
        </a>
        <button class="user-menu-btn" id="userProfileBtn" onclick="location.href='profile.html'">
          <div class="user-avatar-circle" id="headerUserAvatar">👤</div>
          <span id="headerUserName">Account</span>
        </button>
      </div>
    </div>
  </header>

  <section class="wishlist-hero">
    <div class="container">
      <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--dark);">Your Saved Dishes</h1>
      <p style="color: var(--text-secondary); margin-top: 6px;">Quickly reorder and review your favorite dishes.</p>
    </div>
  </section>

  <main class="container">
    <div id="wishlist-empty" style="display: none; text-align: center; padding: 72px 0; background: white; border-radius: var(--radius-2xl); border: 1px solid var(--border); margin: 36px 0;">
      <i class="fa-regular fa-heart fa-3x" style="color: var(--primary); margin-bottom: 16px;"></i>
      <h3 style="font-size: 1.4rem; color: var(--dark); margin-bottom: 6px;">Your wishlist is waiting</h3>
      <p style="color: var(--text-muted); margin-bottom: 24px;">Explore our menu and save the dishes you'd love to try!</p>
      <a href="menu.html" class="btn btn-primary">Browse Menu</a>
    </div>

    <div class="food-grid" id="wishlist-grid"></div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <div class="mobile-nav-grid">
      <a href="index.html" class="mobile-nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="menu.html" class="mobile-nav-item">
        <i class="fa-solid fa-utensils"></i>
        <span>Menu</span>
      </a>
      <a href="orders.html" class="mobile-nav-item">
        <i class="fa-solid fa-receipt"></i>
        <span>Orders</span>
      </a>
      <a href="cart.html" class="mobile-nav-item">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Cart</span>
        <span class="mobile-badge cart-count-badge" style="display: none;">0</span>
      </a>
      <a href="profile.html" class="mobile-nav-item">
        <i class="fa-solid fa-user"></i>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      WishlistService.renderWishlistPage();
    });
  </script>
</body>
</html>
