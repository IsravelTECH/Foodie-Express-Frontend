<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Foodie Express</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <style>
    .signup-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 0%, rgba(232, 93, 4, 0.08) 0%, rgba(255, 253, 249, 0) 70%);
    }
    .signup-card {
      width: min(480px, 100%);
      background: var(--surface);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .strength-meter {
      height: 4px;
      background: #E5E7EB;
      border-radius: var(--radius-pill);
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="signup-wrapper">
    <div class="signup-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 16px;">
          <div class="logo-badge"><i class="fa-solid fa-utensils"></i></div>
          <span class="brand-title">Foodie<span>Express</span></span>
        </a>
        <h1 style="font-size: 1.8rem; color: var(--dark); margin-bottom: 6px;">Create Your Account</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Join Foodie Express for lightning-fast food delivery & bookings.</p>
      </div>

      <form id="signup-form" onsubmit="AuthService.handleSignup(event)">
        <div style="margin-bottom: 18px;">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="John Doe" required autocomplete="name">
        </div>

        <div style="margin-bottom: 18px;">
          <label class="form-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div style="margin-bottom: 24px;">
          <label class="form-label" for="signup-password">Create Password</label>
          <div style="position: relative;">
            <input type="password" id="signup-password" class="form-control" placeholder="At least 6 characters" required autocomplete="new-password" oninput="updateStrength(this.value)">
            <button type="button" onclick="AuthService.togglePasswordVisibility('signup-password', this)" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <div class="strength-meter">
            <div id="pwdStrengthFill" class="strength-fill"></div>
          </div>
          <div id="pwdStrengthText" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-align: right;"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; justify-content: center; margin-bottom: 20px;">
          Create Account <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div style="text-align: center; font-size: 0.88rem; color: var(--text-secondary); padding-top: 16px; border-top: 1px solid var(--border);">
          <p>Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In</a></p>
          <div style="margin-top: 12px;">
            <a href="index.html" style="font-size: 0.82rem; color: var(--text-muted);">← Back to Storefront</a>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    function updateStrength(pwd) {
      const st = AuthService.checkPasswordStrength(pwd);
      const fill = document.getElementById('pwdStrengthFill');
      const text = document.getElementById('pwdStrengthText');
      if (fill) {
        fill.style.width = `${st.score}%`;
        fill.style.backgroundColor = st.color;
      }
      if (text) {
        text.textContent = st.text ? `Strength: ${st.text}` : '';
        text.style.color = st.color;
      }
    }
  </script>
</body>
</html>
